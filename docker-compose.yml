x-defaults: &restart-unless-stopped
  restart: unless-stopped

services:
  ldap:
    <<: *restart-unless-stopped
    image: osixia/openldap:1.5.0
    container_name: ldap
    environment:
      LDAP_ORGANISATION: Demo
      LDAP_DOMAIN: demo.local
      LDAP_ADMIN_PASSWORD: ${FREEIPA_ADMIN_PASSWORD:-Secret123!}
      LDAP_TLS: "false"
    ports:
      - "389:389"
    volumes:
      - ldap-data:/var/lib/ldap
      - ldap-config:/etc/ldap/slapd.d
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://127.0.0.1:389 -b '' -s base '(objectclass=*)' namingContexts | grep -q 'dc=demo,dc=local'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  postgres:
    <<: *restart-unless-stopped
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-admin-secret}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    <<: *restart-unless-stopped
    image: hashicorp/vault:1.19
    container_name: vault
    cap_add:
      - IPC_LOCK
    entrypoint: ["vault"]
    command: ["server", "-config=/vault/config/config.hcl"]
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    ports:
      - "8200:8200"
    volumes:
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
      - vault-init-data:/vault/init
    networks:
      - demo-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null 'http://127.0.0.1:8200/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200' || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  vault-init:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile.init
    container_name: vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      FREEIPA_ADMIN_PASSWORD: ${FREEIPA_ADMIN_PASSWORD:-Secret123!}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-admin-secret}
      PGHOST: postgres
      TECH_USER: app_tech
      STATIC_ROLE: app-tech
      ROTATION_PERIOD: 1h
      LDAP_HOST: ldap
    volumes:
      - ./docker/vault/policies:/vault/policies:ro
      - ./docker/openldap/bootstrap:/bootstrap:ro
      - vault-init-data:/vault/init
      - vault-data:/vault/file
    networks:
      - demo-net
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      ldap:
        condition: service_started
    restart: "no"

  app:
    <<: *restart-unless-stopped
    build:
      context: .
      dockerfile: src/PostgresVaultService/Dockerfile
    container_name: postgres-vault-service
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    environment:
      Vault__Address: http://vault:8200
      Vault__DatabaseMountPoint: database
      Vault__StaticRoleName: app-tech
      Vault__PollIntervalSeconds: 15
      Postgres__Host: postgres
      Postgres__Port: 5432
      Postgres__Database: appdb
      Postgres__Username: app_tech
      Postgres__InsertIntervalSeconds: 5
      ROLE_ID_FILE: /vault/init/app-role-id
      SECRET_ID_FILE: /vault/init/app-secret-id
    volumes:
      - vault-init-data:/vault/init:ro
      - ./docker/app-entrypoint.sh:/app/docker-entrypoint.sh:ro
    networks:
      - demo-net
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy

networks:
  demo-net:
    driver: bridge

volumes:
  ldap-data:
  ldap-config:
  postgres-data:
  vault-data:
  vault-init-data:
