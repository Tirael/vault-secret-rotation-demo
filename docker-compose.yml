x-defaults: &restart-unless-stopped
  restart: unless-stopped

services:
  freeipa:
    <<: *restart-unless-stopped
    image: quay.io/freeipa/freeipa-server:rocky-9
    hostname: ipa.demo.local
    container_name: freeipa
    privileged: true
    environment:
      PASSWORD: ${FREEIPA_ADMIN_PASSWORD:-Secret123!}
      IPA_SERVER_IP: 172.28.0.10
      DOMAIN: DEMO.LOCAL
      REALM: DEMO.LOCAL
    volumes:
      - freeipa-data:/data
    networks:
      demo-net:
        ipv4_address: 172.28.0.10
    ports:
      - "8389:389"
      - "8643:636"
      - "8080:80"
      - "8443:443"
    healthcheck:
      test: ["CMD-SHELL", "ldapsearch -x -H ldap://localhost:389 -b dc=demo,dc=local -s base '(objectclass=*)' >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 40
      start_period: 300s

  postgres:
    <<: *restart-unless-stopped
    image: postgres:18
    container_name: postgres
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-admin-secret}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      demo-net:
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d appdb"]
      interval: 5s
      timeout: 5s
      retries: 20

  vault:
    <<: *restart-unless-stopped
    image: hashicorp/vault:1.19
    container_name: vault
    cap_add:
      - IPC_LOCK
    command: server -config=/vault/config/config.hcl
    environment:
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./docker/vault/config.hcl:/vault/config/config.hcl:ro
      - vault-data:/vault/file
      - vault-init-data:/vault/init
    networks:
      demo-net:
    ports:
      - "8200:8200"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8200/v1/sys/health || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 30

  vault-init:
    build:
      context: .
      dockerfile: docker/vault/Dockerfile.init
    container_name: vault-init
    environment:
      VAULT_ADDR: http://vault:8200
      FREEIPA_ADMIN_PASSWORD: ${FREEIPA_ADMIN_PASSWORD:-Secret123!}
      POSTGRES_ADMIN_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:-postgres-admin-secret}
      TECH_USER: app_tech
      STATIC_ROLE: app-tech
      ROTATION_PERIOD: 1h
    volumes:
      - ./docker/vault/policies:/vault/policies:ro
      - vault-init-data:/vault/init
      - vault-data:/vault/file
    depends_on:
      vault:
        condition: service_healthy
      postgres:
        condition: service_healthy
      freeipa:
        condition: service_healthy
    networks:
      demo-net:
    restart: "no"

  app:
    <<: *restart-unless-stopped
    build:
      context: ./src/PostgresVaultService
      dockerfile: Dockerfile
    container_name: postgres-vault-service
    entrypoint: ["/bin/sh", "/app/docker-entrypoint.sh"]
    environment:
      Vault__Address: http://vault:8200
      Vault__DatabaseMountPoint: database
      Vault__StaticRoleName: app-tech
      Vault__PollIntervalSeconds: 15
      Postgres__Host: postgres
      Postgres__Port: 5432
      Postgres__Database: appdb
      Postgres__Username: app_tech
      Postgres__InsertIntervalSeconds: 5
      ROLE_ID_FILE: /vault/init/app-role-id
      SECRET_ID_FILE: /vault/init/app-secret-id
    volumes:
      - vault-init-data:/vault/init:ro
      - ./docker/app-entrypoint.sh:/app/docker-entrypoint.sh:ro
    depends_on:
      vault-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    networks:
      demo-net:

networks:
  demo-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/24

volumes:
  freeipa-data:
  postgres-data:
  vault-data:
  vault-init-data:
